# Chạy trên server:  docker compose up -d --build
# Cần file .env (chép từ .env.example) cùng thư mục. Xem hướng dẫn đầy đủ trong DEPLOY.md.
#
#   caddy (cổng 80/443, tự lấy chứng chỉ HTTPS) → app (Next.js, cổng 3000 nội bộ) → db (PostgreSQL)
#
# Chỉ Caddy mở cổng ra internet; app và database chỉ nói chuyện với nhau trong mạng nội bộ của Docker.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://workhub:${POSTGRES_PASSWORD:?Cần đặt POSTGRES_PASSWORD trong .env}@db:5432/workhub
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: workhub
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Cần đặt DOMAIN trong .env (tên miền trỏ về VPS)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
