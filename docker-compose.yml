# Chạy trên server:  docker compose up -d --build
# Cần file .env (chép từ .env.example) cùng thư mục, có APP_SECRET, POSTGRES_PASSWORD và API key.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://workhub:${POSTGRES_PASSWORD}@db:5432/workhub
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: workhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: workhub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workhub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
